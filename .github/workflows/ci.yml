name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      # The tmux suites (tmux integration, serve and trust end to end) skip without tmux: run them on macOS too.
      - if: runner.os == 'macOS'
        run: brew install tmux
      # DIAGNOSTIC (temporary): sample pty usage on macOS during the tests.
      - if: runner.os == 'macOS'
        run: |
          sysctl kern.tty.ptmx_max || true
          echo "ptys at start: $(ls /dev/ttys* 2>/dev/null | wc -l)"
          ps -axo tty= | sort | uniq -c | sort -rn | head -20
          nohup sh -c 'max=0; while :; do n=$(ls /dev/ttys* 2>/dev/null | wc -l | tr -d " "); echo "$(date +%T) $n" >> "$RUNNER_TEMP/pty.log"; if [ "$n" -gt "$max" ]; then max=$n; { echo "== $(date +%T) $n ptys"; ps -axo pid,ppid,tty,stat,etime,command | grep -v " ?? " ; } > "$RUNNER_TEMP/pty-peak.log"; fi; sleep 0.5; done' > /dev/null 2>&1 &
      - run: npm ci && npm test
      - run: npm run test:bun
      - if: always() && runner.os == 'macOS'
        run: |
          sort -k2 -n "$RUNNER_TEMP/pty.log" | tail -5
          awk '{print $2}' "$RUNNER_TEMP/pty.log" | uniq -c | head -100
          cat "$RUNNER_TEMP/pty-peak.log" | head -200
          echo "ptys at end: $(ls /dev/ttys* 2>/dev/null | wc -l)"

  build:
    uses: ./.github/workflows/build.yml
